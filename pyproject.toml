[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wf-forward"
version = "0.1.0"
description = "Conservative Wright–Fisher diffusion forward solver"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
cli = ["PyYAML>=6"]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8", "PyYAML>=6", "matplotlib>=3.8"]

[project.scripts]
wf-forward = "wf_forward.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wf_forward = ["web_static/*.html", "web_static/*.css", "web_static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["convergence: spatial or temporal convergence", "benchmark: large-grid acceptance"]
